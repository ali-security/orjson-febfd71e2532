name: artifact
on:
  workflow_dispatch:
env:
  RUST_TOOLCHAIN: "nightly-2024-07-02"
  CARGO_UNSTABLE_SPARSE_REGISTRY: "true"
  UNSAFE_PYO3_SKIP_VERSION_CHECK: "1"
jobs:

  sdist:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
    env:
      RUST_TOOLCHAIN: "1.72" # MSRV
    steps:
    - name: rustup stable
      run: |
        curl https://sh.rustup.rs -sSf | sh -s -- --default-toolchain "${RUST_TOOLCHAIN}" -y
        rustup default "${RUST_TOOLCHAIN}"

    - uses: actions/checkout@v4

    - run: python3 -m pip install --user --upgrade pip "maturin==1.6.0" wheel

    - name: Vendor dependencies
      run: |
        maturin build
        cargo fetch
        mkdir .cargo
        cp ci/sdist.toml .cargo/config.toml
        cargo vendor include/cargo --versioned-dirs

    - run: maturin sdist --out=dist

    - run: python3 -m pip install --user dist/orjson*.tar.gz
      env:
        CARGO_NET_OFFLINE: "true"

    - run: python3 -m pip install --user -r test/requirements.txt -r integration/requirements.txt mypy

    - run: pytest -s -rxX -v -n 2 test
      env:
        PYTHONMALLOC: "debug"

    - run: ./integration/run thread
    - run: ./integration/run http
    - run: ./integration/run init
    - run: ./integration/run typestubs

    - name: Store sdist
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: orjson_sdist
        path: dist
        overwrite: true
        retention-days: 1

  manylinux_2_17_amd64:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: [
          { version: '3.12' },
          { version: '3.11' },
          { version: '3.10' },
          { version: '3.9' },
          { version: '3.8' },
        ]
    env:
      CC: "clang"
      CFLAGS: "-Os -fstrict-aliasing -fno-plt -flto=full -emit-llvm"
      LDFLAGS: "-fuse-ld=lld -Wl,-plugin-opt=also-emit-llvm -Wl,--as-needed -Wl,-zrelro,-znow"
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=lld -C linker-plugin-lto -C lto=fat -C link-arg=-Wl,-zrelro,-znow -Z mir-opt-level=4 -Z virtual-function-elimination -Z threads=2 -D warnings"
      PATH: "${{ github.workspace }}/.venv/bin:/github/home/.local/bin:/github/home/.cargo/bin:/root/.local/bin:/root/.cargo/bin:/root/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    container:
      image: fedora:41
    steps:

    - name: cpuinfo
      run: cat /proc/cpuinfo

    - name: Build environment pre-clone
      run: |
        dnf install -y rustup clang lld python${{ matrix.python.version }} git
        rustup-init --default-toolchain "${RUST_TOOLCHAIN}-x86_64-unknown-linux-gnu" --profile minimal --component rust-src -y

    - uses: actions/checkout@v4

    - name: Build environment post-clone
      run: |
        export PATH="$HOME/.local/bin:/github/home/.local/bin:/root/.local/bin:$HOME/.cargo/bin:/github/home/.cargo/bin:/root/.cargo/bin:$PATH"
        if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi

        cargo fetch --target=x86_64-unknown-linux-gnu &

        mkdir .cargo
        cp ci/config.toml .cargo/config.toml

        SYSROOT=$(rustc --print sysroot)
        find "$SYSROOT" -name Cargo.toml -exec grep -l compiler_builtins {} \; | while read f; do sed -i 's/compiler_builtins = "[^"]*"/compiler_builtins = "=0.1.114"/' "$f"; done

        curl -LsSf https://astral.sh/uv/install.sh | sh
        uv venv --python python${{ matrix.python.version }}
        uv pip install --upgrade "maturin==1.6.0" -r test/requirements.txt -r integration/requirements.txt

    - name: maturin
      run: |
        export PATH="$HOME/.local/bin:/github/home/.local/bin:/root/.local/bin:$HOME/.cargo/bin:/github/home/.cargo/bin:/root/.cargo/bin:$PATH"
        if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
        source .venv/bin/activate
        maturin build --release --strip \
          --features=avx512,no-panic,unstable-simd,yyjson \
          --compatibility manylinux_2_17 \
          --interpreter python${{ matrix.python.version }} \
          --target=x86_64-unknown-linux-gnu
        uv pip install target/wheels/orjson*.whl

    - name: pytest
      run: |
        export PATH="$HOME/.local/bin:/github/home/.local/bin:/root/.local/bin:$HOME/.cargo/bin:/github/home/.cargo/bin:/root/.cargo/bin:$PATH"
        if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
        source .venv/bin/activate && pytest -s -rxX -v -n 2 test
      env:
        PYTHONMALLOC: "debug"

    - name: integration thread
      run: |
        export PATH="$HOME/.local/bin:/github/home/.local/bin:/root/.local/bin:$HOME/.cargo/bin:/github/home/.cargo/bin:/root/.cargo/bin:$PATH"
        if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
        source .venv/bin/activate && ./integration/run thread

    - name: integration http
      run: |
        export PATH="$HOME/.local/bin:/github/home/.local/bin:/root/.local/bin:$HOME/.cargo/bin:/github/home/.cargo/bin:/root/.cargo/bin:$PATH"
        if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
        source .venv/bin/activate && ./integration/run http

    - name: integration init
      run: |
        export PATH="$HOME/.local/bin:/github/home/.local/bin:/root/.local/bin:$HOME/.cargo/bin:/github/home/.cargo/bin:/root/.cargo/bin:$PATH"
        if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
        source .venv/bin/activate && ./integration/run init

    - name: pytest numpy
      run: |
        export PATH="$HOME/.local/bin:/github/home/.local/bin:/root/.local/bin:$HOME/.cargo/bin:/github/home/.cargo/bin:/root/.cargo/bin:$PATH"
        if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
        source .venv/bin/activate
        uv pip install -U --pre "numpy>=2.0.0rc1"
        pytest -s test/test_numpy.py
      if: matrix.python.version != '3.8'

    - name: Store wheels
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: orjson_manylinux_2_17_amd64_${{ matrix.python.version }}
        path: target/wheels
        overwrite: true
        retention-days: 1

  musllinux_1_2:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: [
          { version: '3.12' },
          { version: '3.11' },
          { version: '3.10' },
          { version: '3.9' },
          { version: '3.8' },
        ]
        platform:
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            platform: linux/arm64
            features: no-panic,unstable-simd,unwind,yyjson
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            platform: linux/amd64
            features: avx512,no-panic,unstable-simd,unwind,yyjson
    steps:
    - uses: actions/checkout@v4

    - name: build-std
      run: |
        mkdir .cargo
        cp ci/config.toml .cargo/config.toml

    - name: Build
      uses: PyO3/maturin-action@v1
      env:
        CC: "gcc"
        CFLAGS: "-Os"
        LDFLAGS: "-Wl,--as-needed"
        RUSTFLAGS: "-C lto=fat -Z mir-opt-level=4 -Z virtual-function-elimination -Z threads=2 -D warnings -C target-feature=-crt-static"
      with:
        rust-toolchain: nightly-2024-07-02
        rustup-components: rust-src
        maturin-version: v1.6.0
        target: ${{ matrix.platform.target }}
        manylinux: musllinux_1_2
        container: ''
        before-script-linux: |
          SYSROOT=$(rustc --print sysroot)
          find "$SYSROOT" -name Cargo.toml -exec grep -l compiler_builtins {} \; | while read f; do sed -i 's/compiler_builtins = "[^"]*"/compiler_builtins = "=0.1.114"/' "$f"; done
        args: --release --strip --out=dist --features=${{ matrix.platform.features }} -i python${{ matrix.python.version }}

    - name: QEMU
      if: matrix.platform.arch != 'x86_64'
      uses: docker/setup-qemu-action@v3
      with:
        image: tonistiigi/binfmt:qemu-v8.1.5
        platforms: ${{ matrix.platform.platform }}

    - name: Test
      uses: addnab/docker-run-action@v3
      with:
        image: quay.io/pypa/musllinux_1_2_${{ matrix.platform.arch }}:${{ matrix.python.version == '3.8' && '2024.07.02-0' || 'latest' }}
        options: -v ${{ github.workspace }}:/io -w /io
        run: |
          apk add tzdata
          sed -i '/^psutil/d' test/requirements.txt # missing 3.11, 3.12 wheels
          sed -i '/^numpy/d' test/requirements.txt

          python${{ matrix.python.version }} -m venv venv
          venv/bin/pip install -U pip wheel
          venv/bin/pip install -r test/requirements.txt
          venv/bin/pip install orjson --no-index --find-links dist/ --force-reinstall
          venv/bin/python -m pytest -s -rxX -v -n 2 test

    - name: Store wheels
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: orjson_musllinux_1_2_${{ matrix.platform.arch }}_${{ matrix.python.version }}
        path: dist
        overwrite: true
        retention-days: 1

  manylinux_2_17_non_amd64:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: [
          { version: '3.12', abi: 'cp312-cp312' },
          { version: '3.11', abi: 'cp311-cp311' },
          { version: '3.10', abi: 'cp310-cp310' },
          { version: '3.9', abi: 'cp39-cp39' },
          { version: '3.8', abi: 'cp38-cp38' },
        ]
        target: [
          {
            arch: 'aarch64',
            cflags: '-Os -flto=full -fstrict-aliasing',
            features: 'no-panic,unstable-simd,yyjson',
            rustflags: '-Z mir-opt-level=4 -C lto=fat -D warnings',
            target: 'aarch64-unknown-linux-gnu',
            cp38_image: 'ghcr.io/rust-cross/manylinux2014-cross@sha256:f66121856794a303c90c52974227d9fe074f4e9bb52575968e70385c84556031',
          },
          {
            arch: 'armv7',
            cflags: '-Os -flto=full -fstrict-aliasing',
            features: 'no-panic,yyjson', # no SIMD
            rustflags: '-Z mir-opt-level=4 -C lto=fat -D warnings -C opt-level=s',
            target: 'armv7-unknown-linux-gnueabihf',
            cp38_image: 'ghcr.io/rust-cross/manylinux2014-cross@sha256:12b7f1da1e8e04a38848659f3c3a2b2c77861c92af31c1bbfa483bd132895d64',
          },
          {
            arch: 'ppc64le',
            cflags: '-Os -flto=full -fstrict-aliasing',
            features: 'no-panic,unstable-simd,yyjson',
            rustflags: '-Z mir-opt-level=4 -C lto=fat -D warnings',
            target: 'powerpc64le-unknown-linux-gnu',
            cp38_image: 'ghcr.io/rust-cross/manylinux2014-cross@sha256:f6b3a58616a0a8c0a4f3f33d7738bbb0c72dd33ba4cf83503d6d04278da1a52a',
          },
          {
            arch: 's390x',
            cflags: '-Os -flto=full -fstrict-aliasing -march=z10',
            features: 'no-panic,yyjson',
            rustflags: '-Z mir-opt-level=4 -C lto=fat -D warnings -C target-cpu=z10',
            target: 's390x-unknown-linux-gnu',
            cp38_image: 'ghcr.io/rust-cross/manylinux2014-cross@sha256:9444e66aeb8230799c12e895b381e1f664576df7a41b686cbf1a01fa13bf7cb0',
          },
        ]
    steps:
    - uses: actions/checkout@v4
    - name: build-std
      run: |
        mkdir .cargo
        cp ci/config.toml .cargo/config.toml

    - name: Build
      uses: PyO3/maturin-action@v1
      env:
        PYO3_CROSS_LIB_DIR: "/opt/python/${{ matrix.python.abi }}"
        CFLAGS: "${{ matrix.target.cflags }}"
        LDFLAGS: "-Wl,--as-needed"
        RUSTFLAGS: "${{ matrix.target.rustflags }}"
      with:
        target: ${{ matrix.target.target }}
        rust-toolchain: nightly-2024-07-02
        rustup-components: rust-src
        maturin-version: v1.6.0
        manylinux: auto
        container: ${{ matrix.python.version == '3.8' && matrix.target.cp38_image || '' }}
        before-script-linux: |
          CB_VER='${{ matrix.target.arch == 's390x' && '0.1.109' || '0.1.114' }}'
          SYSROOT=$(rustc --print sysroot)
          find "$SYSROOT" -name Cargo.toml -exec grep -l compiler_builtins {} \; | while read f; do sed -i "s/compiler_builtins = \"[^\"]*\"/compiler_builtins = \"=$CB_VER\"/" "$f"; done
        args: --release --strip --out=dist --features=${{ matrix.target.features }} -i python${{ matrix.python.version }}

    - uses: uraimo/run-on-arch-action@v2
      name: Test
      with:
        arch: ${{ matrix.target.arch }}
        distro: ubuntu22.04
        githubToken: ${{ github.token }}
        install: |
          export TZ=UTC
          export DEBIAN_FRONTEND=noninteractive
          # This block runs under QEMU user-mode emulation, which segfaults
          # sporadically mid-apt (exit 139 / dpkg exit 100). Retry each step,
          # repairing any half-configured dpkg state between attempts.
          retry() {
            n=0
            until [ $n -ge 2 ]; do
              "$@" && return 0
              n=$((n+1))
              sleep 5
              if ! dpkg --configure -a; then sleep 1; fi
            done
            return 1
          }
          retry apt-get update
          retry apt-get install -y --no-install-recommends software-properties-common gpg gpg-agent curl
          retry add-apt-repository ppa:deadsnakes/ppa
          retry apt-get update
          retry apt-get install -y --no-install-recommends gcc g++ python${{ matrix.python.version }}-dev python${{ matrix.python.version }}-venv
        run: |
          # QEMU user-mode emulation segfaults sporadically during pip's own
          # work (exit 139); retry only the dependency install, never pytest.
          retry() { n=0; until [ $n -ge 2 ]; do "$@" && return 0; n=$((n+1)); sleep 5; done; return 1; }
          retry python${{ matrix.python.version }} -m venv venv
          retry venv/bin/pip install -U pip wheel
          retry venv/bin/pip install -r test/requirements.txt
          retry venv/bin/pip install orjson --no-index --find-links dist/ --force-reinstall
          venv/bin/python -m pytest -s -rxX -v -n 2 test

    - name: Store wheels
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: orjson_manylinux_2_17_${{ matrix.target.arch }}_${{ matrix.python.version }}
        path: dist
        overwrite: true
        retention-days: 1

  macos_universal2_aarch64:
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: [
          { version: '3.12', macosx_target: "10.15" },
          { version: '3.11', macosx_target: "10.15" },
          { version: '3.10', macosx_target: "10.15" },
        ]
    env:
      CC: "clang"
      CFLAGS: "-Os -fstrict-aliasing -flto=full"
      LDFLAGS: ""
      CFLAGS_x86_64_apple_darwin: "-O2 -fstrict-aliasing -flto=full -march=x86-64-v2 -mtune=generic"
      CFLAGS_aarch64_apple_darwin: "-O2 -fstrict-aliasing -flto=full -mcpu=apple-m1 -mtune=generic"
      RUSTFLAGS: "-C lto=fat -Z mir-opt-level=4 -Z virtual-function-elimination -Z threads=3 -D warnings"
      PATH: "/Users/runner/.local/bin:${{ github.workspace }}/.venv/bin:/Users/runner/.cargo/bin:/usr/local/opt/curl/bin:/usr/local/bin:/usr/local/sbin:/Users/runner/bin:/Library/Frameworks/Python.framework/Versions/Current/bin:/usr/bin:/bin:/usr/sbin:/sbin"
    steps:

    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "${{ matrix.python.version }}"

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "nightly-2024-07-02"
        targets: "aarch64-apple-darwin, x86_64-apple-darwin"
        components: "rust-src"

    - name: Build environment
      run: |
        cargo fetch --target aarch64-apple-darwin &

        curl -LsSf https://astral.sh/uv/install.sh | sh
        uv venv --python python${{ matrix.python.version }}
        uv pip install --upgrade "maturin==1.6.0" -r test/requirements.txt -r integration/requirements.txt

        mkdir .cargo
        cp ci/config.toml .cargo/config.toml

        SYSROOT=$(rustc --print sysroot)
        find "$SYSROOT" -name Cargo.toml -exec grep -l compiler_builtins {} \; | while read f; do sed -i '' 's/compiler_builtins = "[^"]*"/compiler_builtins = "=0.1.114"/' "$f"; done

    - name: maturin
      run: |
        PATH=$HOME/.cargo/bin:$PATH \
        MACOSX_DEPLOYMENT_TARGET="${{ matrix.python.macosx_target }}" \
        PYO3_CROSS_LIB_DIR=$(python -c "import sysconfig;print(sysconfig.get_config_var('LIBDIR'))") \
        maturin build --release --strip \
          --features=no-panic,unstable-simd,yyjson \
          --interpreter python${{ matrix.python.version }} \
          --target=universal2-apple-darwin
        uv pip install target/wheels/orjson*.whl

    - run: pytest -s -rxX -v -n 3 test
      env:
        PYTHONMALLOC: "debug"

    - run: source .venv/bin/activate && ./integration/run thread
    - run: source .venv/bin/activate && ./integration/run http
    - run: source .venv/bin/activate && ./integration/run init

    - name: Store wheels
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: orjson_universal2_aarch64_${{ matrix.python.version }}
        path: target/wheels
        overwrite: true
        retention-days: 1

  macos_universal2_amd64:
