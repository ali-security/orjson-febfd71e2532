  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: [
          { version: '3.13' },
          { version: '3.12' },
          { version: '3.11' },
          { version: '3.10' },
          { version: '3.9' },
          { version: '3.8' },
        ]
        platform:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc
    steps:

    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "${{ matrix.python.version }}"
        architecture: "${{ matrix.platform.arch }}"

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "nightly-2024-07-02"
        targets: "${{ matrix.platform.target }}"
        components: "rust-src"

    - name: build-std
      run: |
        mkdir .cargo
        cp ci/config.toml .cargo/config.toml

    - name: compiler_builtins pin
      shell: pwsh
      run: |
        $sysroot = (rustc --print sysroot)
        Get-ChildItem -Path $sysroot -Recurse -Filter Cargo.toml | ForEach-Object {
          $body = Get-Content -Raw $_.FullName
          if ($body -match 'compiler_builtins = "') {
            $body = $body -replace 'compiler_builtins = "[^"]*"', 'compiler_builtins = "=0.1.114"'
            Set-Content -NoNewline -Path $_.FullName -Value $body
            Write-Host "pinned compiler_builtins in $($_.FullName)"
          }
        }

    - name: build dependencies
      # cp38-cp312 were released from Azure with maturin 1.6.0; the cp313
      # Windows wheels shipped later, built with 1.7.0. Match each.
      run: python -m pip install --upgrade pip "maturin==${{ matrix.python.version == '3.13' && '1.7.0' || '1.6.0' }}" wheel

    - name: test dependencies
      run: python -m pip install -r test/requirements.txt -r integration/requirements.txt

    - name: build
      run: maturin build --release --strip --features=no-panic,unstable-simd,yyjson -i python --target ${{ matrix.platform.target }} --out dist
      env:
        CFLAGS: "-Os -flto"
        LDFLAGS: "-Wl,--as-needed"
        RUSTFLAGS: "-C lto=fat -Z mir-opt-level=4 -Z virtual-function-elimination -D warnings"
        CARGO_UNSTABLE_SPARSE_REGISTRY: "true"
        UNSAFE_PYO3_SKIP_VERSION_CHECK: "1"

    - name: install
      run: python -m pip install orjson --no-index --find-links=dist --force-reinstall

    - name: pytest
      run: python -m pytest -s -rxX -v test
      env:
        PYTHONMALLOC: "debug"

    - name: thread
      run: python integration/thread

    - name: init
      run: python integration/init

    - name: Store wheels
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: orjson_windows_${{ matrix.platform.arch }}_${{ matrix.python.version }}
        path: dist
        overwrite: true
        retention-days: 1

  pypi:
    name: PyPI
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    if: false
    needs: [
      sdist,
      manylinux_2_17_amd64,
      musllinux_1_2,
      manylinux_2_17_non_amd64,
      macos_universal2_aarch64,
      macos_universal2_amd64,
      windows,
    ]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: orjson_*
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip "maturin==1.6.0"
      - run: ls -1 .
      - name: deploy wheel
        run: maturin upload --skip-existing --username "$MATURIN_USERNAME" *.whl
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      - name: deploy sdist
        run: maturin upload --skip-existing --username "$MATURIN_USERNAME" *.tar.gz
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
